name: Trigger auto deployment for skillquest-rl-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/skillquest-rl-api-AutoDeployTrigger-f3f55ad5-e9d2-482c-94b5-efb2b1bc79cf.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SKILLQUESTRLAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SKILLQUESTRLAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SKILLQUESTRLAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: skillquestacr24056.azurecr.io
          registryUsername: ${{ secrets.SKILLQUESTRLAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SKILLQUESTRLAPI_REGISTRY_PASSWORD }}
          containerAppName: skillquest-rl-api
          resourceGroup: skillquest-rg
          imageToBuild: skillquestacr24056.azurecr.io/skillquest-rl-api:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


